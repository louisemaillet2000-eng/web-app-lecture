<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Ma liste">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Ma liste de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111114;--ink2:#3A3A42;--mute:#5F5F68;--line:#EBEBEF;--soft:#F2F2F5;--soft2:#F7F7F9;--accent:#2F5BEA;--spice:#E8590C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
#view{padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 110px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.sub{margin-top:4px;font-size:14px;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink);flex-shrink:0;padding:0}
.icon-btn.dark{background:var(--ink);color:#fff}
.icon-btn.white{background:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:none;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid #DCDCE2;background:#fff;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.sm{height:32px;font-size:13px;padding:0 12px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.plain{background:var(--soft);color:var(--ink2);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.cover{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:700;line-height:1.15;flex-shrink:0}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.cover span{position:relative;font-size:10px;overflow:hidden}
.card{display:flex;gap:14px;padding:12px;border-radius:16px;background:var(--soft2);border:none;text-align:left;width:100%;color:var(--ink)}
.card .meta{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.gitem{display:flex;flex-direction:column;gap:6px;border:none;background:none;padding:0;text-align:left;min-width:0;color:var(--ink)}
.gitem .cover{aspect-ratio:2/3;width:100%}
.t1{font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem{display:flex;gap:14px;padding:12px 0;border:none;border-bottom:1px solid #F0F0F3;align-items:center;width:100%;background:none;text-align:left;color:var(--ink)}
.litem .meta{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.ttl{font-size:15px;font-weight:600;line-height:1.25}
.aut{font-size:13px;color:var(--mute)}
.small{font-size:12px;color:var(--mute)}
.field{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 6px 0 14px;border-radius:12px;background:var(--soft);color:var(--mute)}
.field input,.field select{flex:1;border:none;background:transparent;font-size:16px;color:var(--ink);outline:none;min-width:0;height:44px}
.inp{width:100%;height:46px;border:none;border-radius:12px;background:var(--soft);padding:0 14px;font-size:16px;outline:none}
.btn{height:46px;padding:0 18px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.light{background:var(--soft);color:var(--ink)}
.btn.line{background:#fff;color:var(--ink);border:1px solid #DCDCE2}
.btn.danger{background:#fff;color:#B42318;border:1px solid #F3C7C3}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.panel{border-radius:16px;background:var(--soft2);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.box{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:28px 18px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5;background:var(--soft2);border-radius:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.err{padding:12px 14px;border-radius:12px;background:#FEF3F2;color:#B42318;font-size:14px;line-height:1.4}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#FFF7E8;font-size:13px;color:#7A4A00}
.banner button{margin-left:auto;border:none;background:none;font-weight:600;color:#7A4A00;padding:6px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:10}
nav#tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:#6E6E78;padding:2px 0;min-height:44px}
nav#tabs button.on{color:var(--accent);font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(17,17,20,.35);z-index:20}
.pane{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;z-index:21;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.full{position:fixed;inset:0;overflow-y:auto;background:#fff;z-index:21;-webkit-overflow-scrolling:touch}
.full-inner{max-width:640px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
.dhead{background:#F4F1EE;padding:calc(env(safe-area-inset-top) + 16px) 20px 28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.dbody{padding:24px 20px 0;display:flex;flex-direction:column;gap:22px}
.spinner{width:22px;height:22px;border:2.5px solid #DCDCE2;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.loading{display:flex;align-items:center;gap:12px;padding:18px;border-radius:16px;background:var(--soft2);font-size:14px;color:var(--ink2)}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.rate{display:flex;gap:0}
.rate button{border:none;background:none;padding:0;width:40px;height:44px;display:flex;align-items:center;justify-content:center}
.hero{border-radius:20px;background:var(--ink);color:#fff;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero .why{font-size:14px;line-height:1.5;color:#E4E4EA}
.bar{height:8px;border-radius:4px;background:#E3E3E8;overflow:hidden}
.bar div{height:8px;background:var(--accent);border-radius:4px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:120px}
.months div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:120px}
.months i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent)}
.months span{font-size:10px;color:var(--mute)}
.months b{font-size:10px;font-weight:600;color:var(--ink2)}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid #C9C9D1;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.check.on{background:var(--ink);border-color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
select.mini{border:none;background:var(--soft);border-radius:10px;height:36px;padding:0 10px;font-size:14px;font-weight:500}
.grab{width:40px;height:5px;border-radius:3px;background:#DCDCE2;align-self:center;margin-top:-8px}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.folder{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;font-size:14px;font-weight:500;color:var(--ink)}
.folder b{margin-left:auto;font-weight:600;color:var(--mute);font-size:13px}
.folder.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.folder svg{flex-shrink:0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);padding:10px 12px;border-radius:10px;word-break:break-all}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs" aria-label="Navigation"></nav>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileShot" accept="image/*" class="sr" aria-hidden="true" tabindex="-1">
<input type="file" id="fileBackup" accept="application/json,.json" class="sr" aria-hidden="true" tabindex="-1">
<script>
'use strict';
/* ============ Constantes ============ */
const GENRES = ['Romantasy','Fantasy','Romance','Roman','Policier & thriller','Historique','Science-fiction','Feel-good','Non-fiction'];
const GSTYLE = {
  'Romantasy':{bg:'#F1E8FD',fg:'#6B2BB0',bar:'#7C3AED'},

const GENRE_DEF = 'Romantasy = fantasy avec une histoire d\'amour centrale. Fantasy = fantasy sans romance centrale. Romance = histoire d\'amour contemporaine ou autre, sans magie. Roman = littérature générale ou contemporaine. Policier & thriller = polar, enquête, suspense, thriller psychologique. Historique = roman historique. Science-fiction = SF, dystopie. Feel-good = roman doudou, cosy, réconfortant. Non-fiction = essai, biographie, développement personnel, documentaire.';
const SPICY = new Set(['Romance','Romantasy']);
const SPICE_BANDS = {'':'Spice : tous','doux':'Doux (0-1)','moyen':'Moyen (2-3)','epice':'Épicé (4-5)'};
const GEMINI_MODELS = ['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest','gemini-flash-lite-latest'];
const AI_TIMEOUT = 20000, AI_BUDGET = 35000;
let AI_BUSY_UNTIL = 0;
const GB_GENRE = {'Romantasy':'romantasy','Fantasy':'subject:fantasy','Romance':'subject:romance','Roman':'subject:"literary fiction"','Policier & thriller':'subject:thriller','Historique':'subject:"historical fiction"','Science-fiction':'subject:"science fiction"','Feel-good':'"feel good" roman','Non-fiction':'subject:biography'};

  'Science-fiction':['subject:"science fiction"','dystopian novel','roman science-fiction'],
  'Feel-good':['roman feel good','"cozy" novel','roman feel-good bestseller'],
  'Non-fiction':['subject:biography bestseller','essai bestseller','subject:"self-help"']
};
const STORE = 'ma-liste-lecture-v1';
const APP_VERSION = '2026-11-09 · v12';
const COVER_COLORS = ['#7A2E1F','#1F3A5F','#3B3B3B','#5C1A1A','#2D4A3E','#4A5568','#0F5257','#8C2F39','#5B1E2D','#7A5C2E'];
const MONTHS = ['J','F','M','A','M','J','J','A','S','O','N','D'];

const I = {
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  image:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  insta:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>',
  refresh:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>',
  tabLib:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2.5z"/><path d="M4 19.5A2 2 0 0 1 6 21h14"/></svg>',
  tabSearch:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  tabMe:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>',
  tabStats:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'
};
const starSVG = (on, size=26) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${on?'#111114':'none'}" stroke="${on?'#111114':'#B8B8C0'}" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>`;
const pepSVG = (on, size=26) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${on?'#E8590C':'none'}" stroke="${on?'#C2410C':'#B8B8C0'}" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.5 3 3.5 4.5 3.5 8.5a3.5 3.5 0 0 1-7 0c0-1.6.8-2.6 1.6-3.4C10.6 10 11 11 12 11c0-2.5-1.5-4.5 0-8z"/><path d="M8.6 14.5A5.2 5.2 0 0 0 12 21a5.2 5.2 0 0 0 5.2-5.2"/></svg>`;

/* ============ Données ============ */
function defaults(){ return {deleted:{},books:[],settings:{apiKey:'',goal:25,aiStatus:'',model:'',ghToken:'',gistId:''},recs:[],dislikes:[],curated:{},lastBackup:0}; }
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && Array.isArray(s.books)){ const d=defaults(); return Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{})}); } }catch(e){}
  return defaults();
}
let S = loadState();
function touch(b){ if(b) b.updatedAt = Date.now(); }
function saveLocal(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){ toast("Impossible d'enregistrer sur cet appareil."); } }
function save(){ saveLocal(); scheduleSync(); }

/* ============ Synchronisation (gist privé GitHub) ============ */
const GIST_DESC = 'Ma liste de lecture (sync)', GIST_FILE = 'ma-liste-lecture.json';
const SYNC = {busy:false, err:'', timer:null, key:''};
const syncKey = () => JSON.stringify([S.books, S.deleted || {}, S.dislikes || []]);
function scheduleSync(){
  if(!S.settings || !S.settings.ghToken) return;
  if(syncKey() === SYNC.key) return;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => syncNow(false), 2500);
}
async function gh(path, opt){
  let r;
  try{ r = await fetch('https://api.github.com' + path, Object.assign({}, opt || {}, {headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer ' + S.settings.ghToken.trim(),'content-type':'application/json'}})); }
  catch(e){ throw new Error('Pas de connexion à GitHub.'); }
  if(r.status === 401) throw new Error('Jeton GitHub refusé : vérifie-le dans les réglages.');
  if(r.status === 403) throw new Error('Le jeton GitHub n\'a pas le droit « gist ».');
  if(!r.ok){ const e = new Error('Synchro GitHub impossible (' + r.status + ').'); e.status = r.status; throw e; }
  if(r.status === 204) return null;
  return r.json();
}
function mergeRemote(rem){
  if(!rem || !Array.isArray(rem.books)) return false;
  const before = syncKey();
  const ts = b => b.updatedAt || b.addedAt || 0;
  const del = Object.assign({}, rem.deleted || {});
  Object.entries(S.deleted || {}).forEach(([k, v]) => { if(!del[k] || v > del[k]) del[k] = v; });
  const map = new Map();
  rem.books.concat(S.books).forEach(b => { if(!b || !b.id) return; const cur = map.get(b.id); if(!cur || ts(b) > ts(cur)) map.set(b.id, b); });
  let books = [...map.values()].filter(b => !(del[b.id] && del[b.id] >= ts(b)));
  const byTitle = new Map();
  books.forEach(b => { const k = norm(b.title); const o = byTitle.get(k); if(!o) byTitle.set(k, b); else { const keep = ts(b) > ts(o) ? b : o, drop = keep === b ? o : b; del[drop.id] = Date.now(); byTitle.set(k, keep); } });
  books = [...byTitle.values()].sort((a, b) => (b.addedAt||0) - (a.addedAt||0));
  S.books = books; S.deleted = del;
  S.dislikes = [...new Set((S.dislikes || []).concat(rem.dislikes || []))];
  return syncKey() !== before;
}
async function syncNow(manual){
  if(!S.settings.ghToken){ if(manual) toast('Ajoute d\'abord ton jeton GitHub.'); return; }
  if(SYNC.busy) return;
  SYNC.busy = true; SYNC.err = ''; if(SHEET && SHEET.kind === 'settings') renderSheet();
  let changed = false;
  try{
    let gist = null;
    // retrouve TOUTES les copies (si deux appareils en ont créé chacun une, on les fusionne)
    const list = await gh('/gists?per_page=100&t=' + Date.now());
    const mine = list.filter(g => g.description === GIST_DESC && g.files && g.files[GIST_FILE]).sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)));
    const extras = [];
    for(const g of mine){
      const full = await gh('/gists/' + g.id + '?t=' + Date.now());
      if(!gist) gist = full; else extras.push(full);
    }
    for(const x of extras){
      try{ const c = x.files[GIST_FILE].content; if(c){ if(mergeRemote(JSON.parse(c))) changed = true; } }catch(e){}
    }
    if(gist){
      S.settings.gistId = gist.id;
      const f = gist.files[GIST_FILE];
      let content = f && f.content;
      if(f && f.truncated && f.raw_url){ try{ content = await (await fetch(f.raw_url)).text(); }catch(e){} }
      let remKey = '';
      if(content){ try{ const rem = JSON.parse(content); remKey = JSON.stringify([rem.books, rem.deleted || {}, rem.dislikes || []]); changed = mergeRemote(rem); }catch(e){} }
      if(syncKey() !== remKey || extras.length){
        await gh('/gists/' + gist.id, {method:'PATCH', body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify({app:'ma-liste-lecture', v:1, at:Date.now(), books:S.books, deleted:S.deleted || {}, dislikes:S.dislikes || []})}}})});
      }
    } else {
      const g = await gh('/gists', {method:'POST', body:JSON.stringify({description:GIST_DESC, public:false, files:{[GIST_FILE]:{content:JSON.stringify({app:'ma-liste-lecture', v:1, at:Date.now(), books:S.books, deleted:S.deleted || {}, dislikes:S.dislikes || []})}}})});
      S.settings.gistId = g.id;
    }
    for(const x of extras){ try{ await gh('/gists/' + x.id, {method:'DELETE'}); }catch(e){} }
    SYNC.key = syncKey(); S.lastSync = Date.now(); saveLocal();
    if(manual) toast(changed ? 'Liste synchronisée' : 'Tout est à jour');
  }catch(e){ SYNC.err = e.message; if(manual) toast(e.message); }
  SYNC.busy = false;
  if(changed){ render(); if(SHEET && SHEET.kind === 'detail' && SHEET.id && !S.books.some(b => b.id === SHEET.id)) closeSheet(); }
  renderSheet();
}

function colorFor(s){ let h=0; for(const c of String(s)) h=(h*31 + c.charCodeAt(0))>>>0; return COVER_COLORS[h % COVER_COLORS.length]; }

function guessGenre(c){
  const cat = norm((c.categories||[]).join(' ') + ' ' + (c.desc||'').slice(0,300));
  if(/romantasy/.test(cat)) return 'Romantasy';
  if(/fantasy/.test(cat) && /romance|love/.test(cat)) return 'Romantasy';
  if(/fantasy/.test(cat)) return 'Fantasy';
  if(/romance|love stor/.test(cat)) return 'Romance';
  if(/thriller|mystery|detective|crime|polar|suspense/.test(cat)) return 'Policier & thriller';
  if(/historical|histori/.test(cat)) return 'Historique';
  if(/science fiction|dystopi/.test(cat)) return 'Science-fiction';
  if(/biography|self help|history|psychology|essai|business|cooking|nonfiction|non fiction/.test(cat)) return 'Non-fiction';
  return 'Roman';
}

function gbMap(it){
  const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
  const isbn = (ids.find(i=>i.type==='ISBN_13') || ids.find(i=>i.type==='ISBN_10') || {}).identifier || '';
  let thumb = (v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail)) || '';
  thumb = thumb.replace(/^http:/,'https:').replace('&edge=curl','');
  return { gid:it.id, gRating:v.averageRating||null, gCount:v.ratingsCount||0, title:v.title||'', author:(v.authors||[]).join(', '), desc:cleanDesc(v.description), categories:v.categories||[], isbn, thumb, pages:v.pageCount||null, year:(v.publishedDate||'').slice(0,4), lang:v.language||'' };
}
const GB_CACHE = {};
let GB_BLOCKED_UNTIL = 0;
async function fetchJSON(url, ms){
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), ms || 15000);
  try{ const r = await fetch(url, {signal:ctrl.signal}); if(!r.ok){ const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; } return await r.json(); }
  catch(e){ if(e.name === 'AbortError'){ const x = new Error('timeout'); x.status = 0; throw x; } throw e; }
  finally{ clearTimeout(timer); }
}
async function gbSearch(q, max){
  const url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&maxResults=' + (max||20) + '&printType=books';
  if(GB_CACHE[url]) return GB_CACHE[url];
  if(Date.now() < GB_BLOCKED_UNTIL) throw new Error('Google Books limité');
  try{
    const j = await fetchJSON(url, 12000);
    return GB_CACHE[url] = (j.items || []).map(gbMap).filter(x => x.title);
  }catch(e){ if(e.status === 429) GB_BLOCKED_UNTIL = Date.now() + 10*60000; throw e; }
}
/* ---- Open Library (gratuit, sans limite stricte) ---- */
const OL_FIELDS = 'key,title,author_name,cover_i,first_publish_year,number_of_pages_median,subject,ratings_average,ratings_count,readinglog_count';
const OL_CACHE = {};
function olMap(d){
  return { olKey:d.key||'', title:d.title||'', author:(d.author_name||[]).slice(0,2).join(', '), desc:'', categories:(d.subject||[]).slice(0,12),
    isbn:'', thumb: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-M.jpg' : '', pages:d.number_of_pages_median||null,
    year: d.first_publish_year ? String(d.first_publish_year) : '', gRating: d.ratings_average ? Math.round(d.ratings_average*10)/10 : null,
    gCount: d.ratings_count||0, reads: d.readinglog_count||0 };
}
async function olSearch(params){
  const p = new URLSearchParams(Object.assign({fields:OL_FIELDS, limit:20}, params));
  const url = 'https://openlibrary.org/search.json?' + p.toString();
  if(OL_CACHE[url]) return OL_CACHE[url];
  const j = await fetchJSON(url, 15000);
  return OL_CACHE[url] = (j.docs || []).map(olMap).filter(x => x.title);
}
async function olDesc(key){
  if(!key) return '';
  try{ const j = await fetchJSON('https://openlibrary.org' + key + '.json', 8000); const d = j.description; return cleanDesc(typeof d === 'string' ? d : (d && d.value) || '').replace(/\(\[source\]\[\d+\]\)|\[\d+\]:.*$/gs,'').trim(); }
  catch(e){ return ''; }
}
async function bookSearch(q, max){
  let res = [], err = null;
  try{ res = await olSearch({q, limit:max||20}); }catch(e){ err = e; }
  if(res.length < 3){ try{ const g = await gbSearch(q, max||20); res = res.concat(g); }catch(e){ err = err || e; } }
  if(!res.length && err) throw new Error('La recherche de livres ne répond pas pour le moment, réessaie dans un instant.');
  return res;
}
async function gbFind(title, author){
  let res = [];
  try{ res = await olSearch(Object.assign({title, limit:8, sort:'readinglog'}, author ? {author:author.split(',')[0]} : {})); }catch(e){}
  res = res.filter(r => similar(title, r.title));
  if(!res.length){ try{ res = await olSearch({q:title + ' ' + (author||''), limit:8}); res = res.filter(r => similar(title, r.title)); }catch(e){} }
  if(!res.find(r => r.thumb)){
    let g = [];
    try{ g = await gbSearch('intitle:"' + title + '"' + (author ? ' inauthor:"' + author.split(',')[0] + '"' : ''), 6); }catch(e){}
    g = g.filter(r => similar(title, r.title));
    const gb = g.find(r => r.thumb && r.desc) || g.find(r => r.thumb);
    if(gb) return res[0] ? Object.assign(res[0], {thumb:gb.thumb, desc:gb.desc, isbn:gb.isbn}) : gb;
  }
  return res.find(r => r.thumb) || res[0] || null;
}
function baseCand(title, author){ return {title, author:author||'', desc:'', categories:[], isbn:'', thumb:'', pages:null, year:''}; }
async function lookup(title, author){
  const g = await gbFind(title, author).catch(()=>null);
  return g ? Object.assign(g, {title: title, author: author || g.author}) : baseCand(title, author);
}

/* ============ IA (Gemini) ============ */
function hasAI(){ return !!(S.settings.apiKey||'').trim() && S.settings.aiStatus !== 'blocked'; }
async function ai({system, text, image, max_tokens}){
  const key = (S.settings.apiKey || '').trim();
  if(!key){ const e = new Error('Ajoute ta clé Gemini gratuite dans les réglages (roue crantée) pour utiliser l\'IA.'); e.nokey = true; throw e; }
  const parts = [];
  if(image) parts.push({inline_data:{mime_type:image.type, data:image.data}});
  parts.push({text});
  const bodyFor = m => JSON.stringify({systemInstruction:{parts:[{text:system}]}, contents:[{role:'user', parts}], generationConfig:Object.assign({responseMimeType:'application/json', maxOutputTokens:Math.max(8192, max_tokens||0), temperature:0.4}, /2\.5/.test(m) ? {thinkingConfig:{thinkingBudget:0}} : {})});
  const models = [...new Set([S.settings.model].filter(m => GEMINI_MODELS.includes(m)).concat(GEMINI_MODELS))];
  const t0 = Date.now();
  if(Date.now() < AI_BUSY_UNTIL){ const e = new Error('L\'IA gratuite de Google est surchargée en ce moment, réessaie dans quelques minutes.'); e.busy = true; throw e; }
  let lastErr = null;
  const sleep = ms => new Promise(res => setTimeout(res, ms));
  for(const m of models){
   if(Date.now() - t0 > AI_BUDGET) break;
   for(let attempt = 0; attempt < 2; attempt++){
    let r;
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), AI_TIMEOUT);
    try{ r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + m + ':generateContent', {method:'POST', headers:{'content-type':'application/json','x-goog-api-key':key}, body:bodyFor(m), signal:ctrl.signal}); }
    catch(e){
      clearTimeout(timer);
      if(e.name === 'AbortError'){ lastErr = new Error('L\'IA gratuite de Google met trop de temps à répondre, réessaie dans quelques minutes.'); lastErr.busy = true; break; }
      throw new Error('Pas de connexion à l\'IA. Vérifie ton réseau.');
    }
    clearTimeout(timer);
    if(r.ok){
      const j = await r.json();
      if(S.settings.model !== m || S.settings.aiStatus){ S.settings.model = m; S.settings.aiStatus = ''; save(); }
      const c = j.candidates && j.candidates[0];
      const t = c && c.content && (c.content.parts || []).map(p => p.text || '').join('');
      if(!t) throw new Error('L\'IA n\'a pas répondu, réessaie.');
      return t;
    }
    let msg = ''; try{ msg = (await r.json()).error.message || ''; }catch(e){}
    if(r.status === 404 || (r.status === 400 && /thinking/i.test(msg))){ lastErr = new Error('Modèle Gemini indisponible.'); break; }
    if(r.status === 503 || r.status === 500 || r.status === 502 || r.status === 504){
      lastErr = new Error('L\'IA gratuite de Google est surchargée en ce moment, réessaie dans quelques minutes.'); lastErr.busy = true;
      if(attempt === 0 && Date.now() - t0 < AI_BUDGET){ await sleep(1500); continue; } break;
    }
    if(r.status === 429){ lastErr = new Error('Limite gratuite de Gemini atteinte pour le moment, réessaie un peu plus tard.'); lastErr.busy = true; break; }
    if(/location is not supported|not available in your country|free tier is not available|enable billing/i.test(msg)){
      S.settings.aiStatus = 'blocked'; save();
      const e = new Error('Gemini gratuit n\'est pas disponible depuis ton pays : l\'app passe en mode sans IA.'); e.blocked = true; throw e;
    }
    if(r.status === 403 || /api key/i.test(msg)) throw new Error('Clé Gemini refusée : vérifie-la dans les réglages.');
    throw new Error('Erreur de l\'IA (' + r.status + ') ' + msg);
   }
  }
  if(lastErr && lastErr.busy) AI_BUSY_UNTIL = Date.now() + 90000;
  throw lastErr || new Error('IA indisponible.');
}
function parseJSON(t){
  const a = t.indexOf('{'), b = t.indexOf('[');
  const start = a < 0 ? b : (b < 0 ? a : Math.min(a, b));
  const end = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(start < 0 || end < start) throw new Error('Réponse de l\'IA illisible, réessaie.');
  return JSON.parse(t.slice(start, end + 1));
}
async function extractBooks({text, image}){
  const system = 'Tu reçois une capture d\'écran Instagram (texte extrait par OCR, ou image) où quelqu\'un recommande des livres. Il y en a souvent plusieurs (top 3, top 5, liste dans la légende, couvertures côte à côte) : liste-les TOUS, un par entrée, sans en oublier. Ignore l\'interface d\'Instagram (pseudos, likes, commentaires, boutons, musique, hashtags qui ne sont pas des titres). Corrige les fautes d\'OCR évidentes et écris le titre tel qu\'il est publié. Si l\'auteur n\'est pas visible mais que tu le connais avec certitude, indique-le ; sinon chaîne vide. Réponds uniquement en JSON : {"books":[{"title":"","author":""}]} ; s\'il n\'y a aucun livre : {"books":[]}.';
  const out = await ai({system, image, text: text ? 'Texte extrait de la capture :\n"""\n' + text.slice(0, 6000) + '\n"""' : 'Voici la capture.'});
  const seen = new Set();
  return (parseJSON(out).books || []).filter(b => b && b.title && !seen.has(norm(b.title)) && seen.add(norm(b.title)));
}
async function enrichBooks(cands){
  const system = 'Tu es une libraire experte. Pour chaque livre reçu, donne des informations fiables en français. Genre : exactement un parmi ' + GENRES.join(', ') + '. Définitions : ' + GENRE_DEF + ' Spice = intensité des scènes de sexe, de 0 (aucune) à 5 (très explicite), seulement pour Romance et Romantasy, sinon null. Si tu n\'es pas sûre d\'une info de série, mets null. Réponds uniquement en JSON, dans le même ordre que l\'entrée : {"books":[{"title":"","author":"","series":null,"tome":null,"seriesTotal":null,"genre":"","tags":[""],"summary":"","spice":null}]}';
  const items = cands.map((c, i) => ({n:i+1, title:c.title, author:c.author, categories:c.categories, description:(c.desc||'').slice(0,1200)}));
  const known = [...new Set(S.books.map(b => b.series).filter(Boolean))].slice(0,100);
  const text = 'Livres :\n' + JSON.stringify(items) + '\n\n"title" : le titre tel que publié (corrige seulement les erreurs). "series" : nom de la série ou null' + (known.length ? ' (si le livre appartient à une de ces séries déjà dans sa bibliothèque, réutilise exactement ce nom : ' + known.join(' ; ') + ')' : '') + '. "tome" : numéro du livre dans la série. "seriesTotal" : nombre total de tomes parus ou prévus. "tags" : 2 ou 3 mots-clés courts (thèmes ou tropes, ex. "Dragons", "Enemies to lovers", "Huis clos"). "summary" : 3 à 4 phrases en français, sans spoiler.';
  const out = await ai({system, text, max_tokens: 1000 + cands.length * 600});
  const arr = parseJSON(out).books || [];
  return cands.map((c, i) => {
    const e = arr[i] || {};
    return Object.assign({}, c, {
      title: e.title || c.title, author: e.author || c.author,
      series: e.series || '', tome: Number(e.tome) || null, seriesTotal: Number(e.seriesTotal) || null,
      genre: GENRES.includes(e.genre) ? e.genre : (c.genre || guessGenre(c)),
      tags: Array.isArray(e.tags) ? e.tags.filter(Boolean).slice(0,3) : [],
      summary: e.summary || c.desc.slice(0,600),
      spiceEst: typeof e.spice === 'number' ? e.spice : (c.spiceEst ?? null),
      enriched: true
    });
  });
}
function makeBook(c, source, status){
  return { id:uid(), title:c.title, author:c.author||'', series:c.series||'', tome:c.tome||null, seriesTotal:c.seriesTotal||null,
    genre:c.genre||guessGenre(c), tags:c.tags||[], summary:c.summary||(c.desc||'').slice(0,600), spiceEst:c.spiceEst ?? null, spice:null, rating:0,
    status:status||'toread', isbn:c.isbn||'', thumb:c.thumb||'', gid:c.gid||'', pages:c.pages||null, year:c.year||'',
    enriched:!!c.enriched, source:source||{type:'manuel', date:Date.now()}, addedAt:Date.now(), updatedAt:Date.now(), startedAt:status==='reading'?Date.now():null, finishedAt:status==='read'?Date.now():null };
}
async function addCandidates(cands, source, status){
  cands = cands.filter(c => !findOwned(c.title));
  if(!cands.length){ toast('Déjà dans ta liste.'); return []; }
  await Promise.all(cands.map(async c => { if(!c.desc && c.olKey) c.desc = await olDesc(c.olKey); }));
  let rich = cands;
  if(hasAI()){
    try{ rich = await enrichBooks(cands); }catch(e){ toast('Ajouté sans les infos de l\'IA : ' + e.message); }
  }
  const added = rich.map(c => makeBook(c, source, status));
  S.books.unshift(...added); save();
  return added;
}

function fileToImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1568; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
      const cv = document.createElement('canvas'); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      resolve({type:'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1]});
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible.')); };
    img.src = url;
  });
}

/* ============ Rendu : onglets ============ */
function renderTabs(){
  const tabs = [['lib','Bibliothèque',I.tabLib],['search','Recherche',I.tabSearch],['me','Pour moi',I.tabMe],['stats','Stats',I.tabStats]];
  $('#tabs').innerHTML = tabs.map(([k,l,ic]) => `<button data-a="tab" data-v="${k}" class="${UI.tab===k?'on':''}" ${UI.tab===k?'aria-current="page"':''}>${ic}${l}</button>`).join('');
}
function render(){
  renderTabs();
  const v = $('#view');
  const act = document.activeElement, keep = act && (act.id === 'q' || act.id === 'ask') ? {id:act.id, val:act.value, pos:act.selectionStart} : null;
  v.innerHTML = UI.tab==='lib' ? viewLib() : UI.tab==='search' ? viewSearch() : UI.tab==='me' ? viewMe() : viewStats();
  if(keep){ const el = document.getElementById(keep.id); if(el){ el.value = keep.val; el.focus(); try{ el.setSelectionRange(keep.pos, keep.pos); }catch(e){} } }
}

const statusSeg = () => `<div class="col" style="gap:8px"><span class="label">Ajouter dans</span><div class="seg">${[['toread','À lire'],['reading','En cours'],['read','Lus']].map(([k,l]) => `<button type="button" class="${(SHEET.status||'toread')===k?'on':''}" data-a="setStatus" data-v="${k}">${l}</button>`).join('')}</div></div>`;
const folderSVG = c => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
function viewLib(){
  const by = s => S.books.filter(b => b.status === s);
  const reading = by('reading'), toread = by('toread'), read = by('read').sort((a,b) => (b.finishedAt||0) - (a.finishedAt||0));
  const seg = UI.seg;
  let list = seg==='reading' ? reading : seg==='toread' ? toread : read;
  const segCount = list.length;
  const present = GENRES.map(g => ({g, n:list.filter(b => b.genre === g).length})).filter(x => x.n);
  if(UI.libGenre && !present.some(x => x.g === UI.libGenre)) UI.libGenre = '';
  if(UI.libGenre) list = list.filter(b => b.genre === UI.libGenre);
  const tagMap = {};
  list.forEach(b => (b.tags || []).forEach(t => { const k = norm(t); if(!k) return; (tagMap[k] = tagMap[k] || {label:String(t).trim(), n:0}).n++; }));
  const tags = Object.entries(tagMap).sort((a,b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label));
  if(UI.libTag && !tagMap[UI.libTag]) UI.libTag = '';
  if(UI.libTag) list = list.filter(b => (b.tags || []).some(t => norm(t) === UI.libTag));
  const bySeries = {};
  if(seg === 'read') list.forEach(b => { if(b.series){ const k = norm(b.series); (bySeries[k] = bySeries[k] || []).push(b); } });
  if(UI.libSeries && !(bySeries[UI.libSeries] && bySeries[UI.libSeries].length)) UI.libSeries = '';
  let seriesHead = '';
  if(seg === 'read' && UI.libSeries){
    list = bySeries[UI.libSeries].slice().sort((a,b) => (a.tome||99) - (b.tome||99));
    seriesHead = `<div class="row" style="gap:10px"><button class="icon-btn" data-a="closeSeries" aria-label="Retour aux livres lus">${I.back}</button><div><h2>${esc(list[0].series)}</h2><p class="small">${plural(list.length,'livre')} ${list.length>1?'lus':'lu'}</p></div></div>`;
  }
  const needBackup = S.books.length >= 3 && Date.now() - (S.lastBackup||0) > 30*86400000;
  let body;
  if(!S.books.length){
    body = `<div class="empty"><strong style="color:var(--ink);font-size:16px">Ta liste est vide</strong>Tape deux fois au dos de ton iPhone sur une vidéo Instagram, ou ajoute un livre avec le bouton +.<button class="btn" data-a="openAdd">${I.plus} Ajouter un livre</button></div>`;
  } else if(!list.length){
    body = `<div class="empty">${seg==='reading' ? 'Aucune lecture en cours. Ouvre un livre de ta liste et passe-le « En cours ».' : seg==='toread' ? 'Rien à lire pour l\'instant.' : 'Aucun livre terminé pour l\'instant.'}</div>`;
  } else if(seg === 'reading'){
    body = `<div class="col">${list.map(b => `
      <button class="card" data-a="open" data-v="${b.id}">
        ${coverHTML(b,'width:72px;height:108px')}
        <div class="meta"><span style="font-size:16px;font-weight:600;line-height:1.25">${esc(b.title)}</span><span class="aut">${esc(b.author)}</span>${b.series?`<span class="small">${esc(seriesLine(b))}</span>`:''}<span>${genreTag(b.genre)}</span></div>
      </button>`).join('')}</div>`;
  } else {
    const bookItem = b => `
      <button class="gitem" data-a="open" data-v="${b.id}">${coverHTML(b)}<span class="t1">${esc(b.title)}</span><span class="t2">${seg==='read' && b.rating ? '★ ' + b.rating + ' · ' : ''}${UI.libSeries && b.tome ? 'Tome ' + b.tome : esc(b.author)}</span></button>`;
    const seriesItem = (k, books) => {
      const first = books.slice().sort((a,b) => (a.tome||99) - (b.tome||99))[0];
      const rated = books.filter(b => b.rating > 0);
      const avg = rated.length ? (rated.reduce((s,b) => s + b.rating, 0) / rated.length).toFixed(1).replace('.', ',') : '';
      return `<button class="gitem" data-a="openSeries" data-v="${esc(k)}" aria-label="Série ${esc(first.series)}, ${books.length} livres">
        <div style="position:relative">${coverHTML(first, 'box-shadow:4px 4px 0 -1px #fff,4px 4px 0 0 #D6D6DC,8px 8px 0 -1px #fff,8px 8px 0 0 #D6D6DC')}<span style="position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px">${books.length}</span></div>
        <span class="t1" style="margin-top:4px">${esc(first.series)}</span><span class="t2">${avg ? '★ ' + avg + ' · ' : ''}${plural(books.length,'livre')}</span></button>`;
    };
    let items;
    if(seg === 'read' && !UI.libSeries){
      const done = new Set(); items = [];
      list.forEach(b => { const k = b.series ? norm(b.series) : ''; if(k && bySeries[k].length > 1){ if(!done.has(k)){ done.add(k); items.push(seriesItem(k, bySeries[k])); } } else items.push(bookItem(b)); });
    } else items = list.map(bookItem);
    body = `<div class="grid3">${items.join('')}</div>`;
  }
  return `
  <div class="row between">
    <div><h1>Bibliothèque</h1><p class="sub">${reading.length} en cours · ${toread.length} à lire · ${read.length} ${read.length>1?'lus':'lu'}</p></div>
    <div class="row" style="gap:8px"><button class="icon-btn" data-a="openSettings" aria-label="Réglages">${I.gear}</button><button class="icon-btn dark" data-a="openAdd" aria-label="Ajouter un livre">${I.plus}</button></div>
  </div>
  ${needBackup ? `<div class="banner">Pense à sauvegarder ta liste de temps en temps.<button data-a="exportData">Sauvegarder</button></div>` : ''}
  ${!S.settings.apiKey && !S.settings.noAI ? `<div class="banner">Active l'IA gratuite (Gemini) pour les résumés, le spice et les recos.<button data-a="openSettings">Réglages</button></div>` : ''}
  <div class="seg" role="tablist">
    <button class="${seg==='reading'?'on':''}" data-a="seg" data-v="reading">En cours</button>
    <button class="${seg==='toread'?'on':''}" data-a="seg" data-v="toread">À lire</button>
    <button class="${seg==='read'?'on':''}" data-a="seg" data-v="read">Lus</button>
  </div>
  ${present.length && seg !== 'reading' && !UI.libSeries ? `<div class="folders" role="group" aria-label="Genres">
      <button class="folder ${!UI.libGenre?'on':''}" data-a="libGenre" data-v="">${folderSVG('#111114')}Tous<b>${segCount}</b></button>
      ${present.map(x => `<button class="folder ${UI.libGenre===x.g?'on':''}" data-a="libGenre" data-v="${esc(x.g)}">${folderSVG(GSTYLE[x.g].bar)}${esc(x.g)}<b>${x.n}</b></button>`).join('')}
    </div>` : ''}
  ${seriesHead}
  ${tags.length && seg !== 'reading' && !UI.libSeries ? `<div class="col" style="gap:8px"><span class="label">Tags</span><div class="chips scroll">${UI.libTag ? `<button class="chip sm" data-a="libTag" data-v="">${I.close} Effacer</button>` : ''}${tags.map(([k,t]) => `<button class="chip sm ${UI.libTag===k?'on':''}" data-a="libTag" data-v="${esc(k)}">${esc(t.label)} · ${t.n}</button>`).join('')}</div></div>` : ''}
  ${body}`;
}

function viewSearch(){
  const g = UI.sGenre, spicy = SPICY.has(g);
  let body = '';
  if(UI.q){
    if(UI.sLoading) body = `<div class="loading"><div class="spinner"></div>Recherche en cours…</div>`;
    else if(UI.sError) body = `<div class="err">${esc(UI.sError)}</div>`;
    else if(UI.sResults) body = UI.sResults.length ? `<div>${UI.sResults.map((r,i) => resultRow(r, 'res', i)).join('')}</div>` : `<div class="empty">Aucun résultat.</div>`;
  } else if(g){
    body = aiBox(g, spicy) + popBox(g);
  } else body = `<div class="empty">Cherche un titre, un auteur ou une série,<br>ou choisis un genre pour découvrir des livres.</div>`;
  return `
  <h1>Recherche</h1>
  <form class="field" data-form="search" role="search">${I.search}<label class="sr" for="q">Rechercher un titre ou un auteur</label><input id="q" type="search" enterkeyhint="search" placeholder="Titre, auteur, série…" value="${esc(UI.q)}" autocomplete="off">${UI.q ? `<button type="button" class="icon-btn" style="width:36px;height:36px;background:transparent" data-a="clearQ" aria-label="Effacer la recherche">${I.close}</button>` : ''}</form>
  <div class="panel">
    <span class="label">Genre</span>
    <div class="chips"><button class="chip ${!g?'on':''}" data-a="sGenre" data-v="">Tous</button>${GENRES.map(x => `<button class="chip ${g===x?'on':''}" data-a="sGenre" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  </div>
  ${body}`;
}
function aiBox(g, spicy){
  let inner;
  if(!hasAI()) inner = `<p class="small" style="font-size:13px;line-height:1.45">Ajoute ta clé Gemini gratuite pour avoir des recommandations personnalisées ici.</p><button class="btn light" style="height:38px;align-self:flex-start" data-a="openSettings">Réglages</button>`;
  else if(UI.aiLoading) inner = `<div class="row small" style="font-size:13px"><div class="spinner" style="width:18px;height:18px"></div>L'IA choisit pour toi… la liste ci-dessous est déjà prête.</div>`;
  else if(UI.aiError) inner = `<p class="small" style="font-size:13px;line-height:1.45">${esc(UI.aiError)}</p><button class="btn light" style="height:38px;align-self:flex-start" data-a="refreshAI">${I.refresh} Réessayer</button>`;
  else if(UI.aiPicks && UI.aiPicks.length) inner = `<div>${UI.aiPicks.map((r,i) => resultRow(r, 'aip', i, true)).join('')}</div>`;
  else inner = `<p class="small" style="font-size:13px">Pas de suggestion pour l'instant.</p>`;
  return `<div class="box" style="gap:10px;border-color:#D9E2FF;background:#F7F9FF">
    <div class="row between"><span class="row" style="gap:8px;font-size:15px;font-weight:700;color:var(--accent)">${I.tabMe} Recommandation IA</span>
      <div class="row" style="gap:6px">${spicy && hasAI() ? `<label class="sr" for="spice">Niveau de spice</label><select id="spice" class="mini" style="background:#fff" data-change="sSpice">${Object.entries(SPICE_BANDS).map(([k,l]) => `<option value="${k}" ${UI.sSpice===k?'selected':''}>${l}</option>`).join('')}</select>` : ''}
      ${hasAI() && !UI.aiLoading ? `<button class="icon-btn" style="width:36px;height:36px;background:#fff" data-a="refreshAI" aria-label="Autres recommandations">${I.refresh}</button>` : ''}</div></div>
    ${inner}</div>`;
}
function popBox(g){
  let list = '';
  if(UI.popLoading) list = `<div class="loading"><div class="spinner"></div>Chargement des livres populaires…</div>`;
  else if(UI.popError) list = `<div class="err">${esc(UI.popError)}</div><button class="btn light" data-a="sGenre" data-v="${esc(g)}">${I.refresh} Réessayer</button>`;
  else if(UI.pop){
    const items = UI.pop.map((r,i) => ({r,i})).filter(x => !UI.hideRead || !isRead(x.r.title));
    list = items.length ? `<div>${items.map(x => resultRow(x.r, 'pop', x.i)).join('')}</div>` : `<div class="empty">Tu as déjà tout lu ici !</div>`;
  }
  return `<div class="col" style="gap:8px">
    <div class="row between" style="flex-wrap:wrap;gap:8px"><h2>Populaires en ${esc(g)}</h2>
      <button class="chip sm ${UI.hideRead?'on':''}" data-a="toggleRead" aria-pressed="${UI.hideRead}">${UI.hideRead ? I.check + ' ' : ''}Pas encore lus</button></div>
    <p class="small">Les plus lus d'abord (lecteurs et avis Open Library).</p>
    ${list}</div>`;
}
function isRead(title){ const b = findOwned(title); return !!(b && b.status === 'read'); }
function inBand(v, band){ return band==='doux' ? v <= 1 : band==='moyen' ? (v >= 2 && v <= 3) : band==='epice' ? v >= 4 : true; }
function resultRow(r, list, i, showWhy){
  const owned = findOwned(r.title);
  return `<div class="litem"${showWhy ? ' style="align-items:flex-start"' : ''}>
    <button data-a="openCand" data-v="${list}:${i}" style="display:flex;gap:14px;align-items:center;flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;color:var(--ink)">
      ${coverHTML(r,'width:56px;height:84px')}
      <div class="meta"><span class="ttl">${esc(r.title)}</span><span class="aut">${esc(r.author)}${r.series ? ' · ' + esc(r.series) + (r.tome ? ' T' + r.tome : '') : r.year ? ' · ' + esc(r.year) : ''}</span>
      ${(r.gRating || r.reads) ? `<span class="small">${[r.gRating ? '★ ' + String(r.gRating).replace('.', ',') : '', r.reads ? r.reads.toLocaleString('fr-FR') + ' lecteurs' : (r.gCount ? r.gCount + ' avis' : '')].filter(Boolean).join(' · ')}</span>` : ''}
      ${r.spiceEst != null && SPICY.has(r.genre || UI.sGenre) ? `<span class="row small" style="gap:4px">${pepSVG(true,14)} ${r.spiceEst}/5 · estimé par l'IA</span>` : ''}
      ${showWhy && r.why ? `<span style="font-size:13px;line-height:1.4;color:var(--ink2)">${esc(r.why)}</span>` : ''}</div>
    </button>
    ${owned ? `<span class="small" style="flex-shrink:0">Dans ta liste</span>` : `<button class="icon-btn white" style="border:1px solid #DCDCE2" data-a="addCand" data-v="${list}:${i}" aria-label="Ajouter ${esc(r.title)} à ma liste">${I.plus}</button>`}
  </div>`;
}

function viewMe(){

  const recs = S.recs || [];

      <button data-a="openCand" data-v="rec:0" style="display:flex;gap:16px;border:none;background:none;padding:0;text-align:left;color:#fff">

        <div class="col" style="gap:6px;min-width:0"><span style="font-size:19px;font-weight:700;line-height:1.2">${esc(hero.title)}</span><span style="font-size:14px;color:#C9C9D1">${esc(hero.author)}</span><span>${genreTag(hero.genre)}</span>
        ${hero.spiceEst != null && SPICY.has(hero.genre) ? `<span class="row" style="gap:4px;font-size:12px;color:#C9C9D1">${pepSVG(true,14)} ${hero.spiceEst}/5 estimé</span>` : ''}</div>
      </button>
      ${hero.why ? `<p class="why">${esc(hero.why)}</p>` : ''}

          ${coverHTML(r,'width:52px;height:78px')}
          <div class="meta"><span class="ttl">${esc(r.title)}</span><span class="aut">${esc(r.author)}</span><span style="font-size:13px;line-height:1.4;color:var(--ink2)">${esc(r.why)}</span></div>
        </button>
        <div class="col" style="gap:6px"><button class="icon-btn white" style="border:1px solid #DCDCE2" data-a="addCand" data-v="rec:${k+1}" aria-label="Ajouter ${esc(r.title)}">${I.plus}</button><button class="icon-btn white" data-a="dislike" data-v="${k+1}" aria-label="Pas pour moi">${I.close}</button></div>

function viewStats(){
  const y = UI.year;
  const years = [...new Set(S.books.filter(b => b.finishedAt).map(b => new Date(b.finishedAt).getFullYear()).concat([new Date().getFullYear()]))].sort((a,b) => b-a);
  const read = S.books.filter(b => b.status==='read' && b.finishedAt && new Date(b.finishedAt).getFullYear() === y);
  const goal = Number(S.settings.goal) || 0;
  const rated = read.filter(b => b.rating > 0);
  const avg = rated.length ? (rated.reduce((s,b) => s + b.rating, 0) / rated.length) : null;
  const sp = read.filter(b => SPICY.has(b.genre) && (b.spice ?? b.spiceEst) != null);
  const avgSp = sp.length ? sp.reduce((s,b) => s + (b.spice ?? b.spiceEst), 0) / sp.length : null;
  const byG = GENRES.map(g => ({g, n: read.filter(b => b.genre === g).length})).filter(x => x.n);
  const months = Array(12).fill(0); read.forEach(b => months[new Date(b.finishedAt).getMonth()]++);
  const mx = Math.max(1, ...months);
  const pages = read.reduce((s,b) => s + (b.pages||0), 0);
  const f = n => n == null ? '–' : n.toFixed(1).replace('.', ',');
  return `
  <div class="row between"><h1>Stats</h1>
    <label class="sr" for="year">Année</label><select id="year" class="mini" data-change="year">${years.map(v => `<option value="${v}" ${v===y?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="panel" style="padding:20px;border-radius:20px;gap:12px">
    <div class="row" style="align-items:baseline;gap:8px"><span style="font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1">${read.length}</span><span style="font-size:16px;color:var(--ink2)">${read.length>1?'livres lus':'livre lu'} en ${y}</span></div>
    ${goal ? `<div class="bar"><div style="width:${Math.min(100, Math.round(read.length/goal*100))}%"></div></div>
    <span class="small" style="font-size:13px">Objectif : ${goal} livres · ${read.length >= goal ? 'atteint, bravo !' : 'encore ' + (goal - read.length)}</span>` : ''}
  </div>
  <div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div class="box" style="gap:6px"><span class="label">Note moyenne</span><span style="font-size:26px;font-weight:700">${f(avg)}<span style="font-size:15px;font-weight:500;color:var(--mute)"> / 5</span></span></div>
    <div class="box" style="gap:6px"><span class="label">Spice moyen</span><span style="font-size:26px;font-weight:700">${f(avgSp)}<span style="font-size:15px;font-weight:500;color:var(--mute)"> / 5</span></span></div>
  </div>
  ${pages ? `<div class="box" style="gap:6px"><span class="label">Pages lues</span><span style="font-size:26px;font-weight:700">${pages.toLocaleString('fr-FR')}</span></div>` : ''}

function renderSheet(){

  if(!SHEET){ el.innerHTML = ''; document.body.style.overflow = ''; return; }

  if(SHEET.kind === 'detail'){ el.innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="Fiche livre"><div class="full-inner">${sheetDetail()}</div></div>`; return; }
  const inner = SHEET.kind==='add' ? sheetAdd() : SHEET.kind==='import' ? sheetImport() : sheetSettings();
  el.innerHTML = `<div class="backdrop" data-a="close"></div><div class="pane" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
}
/* ============ Navigation « retour » (bouton Safari + glisser vers la droite) ============ */
let NAV_SKIP = 0;
function navPush(){ if(NAV_SKIP){ setTimeout(navPush, 80); return; } try{ history.pushState({nav:Date.now()}, ''); }catch(e){} }
function navPop(){ if(history.state && history.state.nav){ NAV_SKIP++; history.back(); } }
function openSheet(obj){ const had = !!SHEET; SHEET = obj; renderSheet(); if(!had) navPush(); }
function backStep(){
  if(SHEET){ SHEET = null; renderSheet(); render(); return true; }
  if(UI.libSeries){ UI.libSeries = ''; render(); return true; }
  return false;
}
function goBack(){ if(history.state && history.state.nav) history.back(); else backStep(); }
window.addEventListener('popstate', () => { if(NAV_SKIP){ NAV_SKIP--; return; } backStep(); });
function closeSheet(){ const was = !!SHEET; SHEET = null; renderSheet(); render(); if(was) navPop(); }
(function swipeBack(){
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let st = null;
  const target = () => SHEET ? document.querySelector('#sheet .full, #sheet .pane') : (UI.libSeries ? document.getElementById('view') : null);
  document.addEventListener('touchstart', e => {
    st = null;
    if(e.touches.length !== 1 || (!SHEET && !UI.libSeries)) return;
    const t = e.touches[0];
    if(!standalone && t.clientX < 28) return; // laisse Safari gérer son propre geste depuis le bord
    if(e.target.closest('input,select,textarea,.chips.scroll,.rate')) return;
    st = {x:t.clientX, y:t.clientY, dx:0, lock:null, el:target()};
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!st) return;
    const t = e.touches[0]; const dx = t.clientX - st.x, dy = t.clientY - st.y;
    if(st.lock === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) st.lock = Math.abs(dx) > Math.abs(dy) * 1.3 && dx > 0 ? 'x' : 'y';
    if(st.lock !== 'x') return;
    st.dx = Math.max(0, dx);
    if(st.el){ st.el.style.transition = 'none'; st.el.style.transform = 'translateX(' + st.dx + 'px)'; }
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if(!st) return;
    const s0 = st; st = null;
    if(s0.lock !== 'x'){ return; }
    const el = s0.el;
    if(s0.dx > Math.min(120, window.innerWidth * 0.28)){
      if(el){ el.style.transition = 'transform .18s ease-out'; el.style.transform = 'translateX(100%)'; }
      setTimeout(() => { if(el){ el.style.transition = ''; el.style.transform = ''; } goBack(); }, 170);
    } else if(el){ el.style.transition = 'transform .18s ease-out'; el.style.transform = ''; setTimeout(() => { el.style.transition = ''; }, 200); }
  }, {passive:true});
})();

function candFrom(ref){
  const [list, i] = ref.split(':');
  const arr = list==='res' ? UI.sResults : list==='pop' ? UI.pop : list==='aip' ? UI.aiPicks : list==='rec' ? S.recs : list==='add' ? (SHEET && SHEET.results) : null;
  return arr ? arr[Number(i)] : null;
}
async function addOne(cand, sourceType, status){
  const src = {type:sourceType, date:Date.now()};
  const added = await addCandidates([cand], src, status);
  if(added.length) toast('« ' + added[0].title + ' » ajouté à ta liste');
  return added[0];
}
const A = {
  tab(v){ UI.tab = v; render(); window.scrollTo(0,0); },
  seg(v){ if(UI.libSeries) navPop(); UI.seg = v; UI.libGenre = ''; UI.libTag = ''; UI.libSeries = ''; render(); },
  openSeries(v){ UI.libSeries = v; render(); window.scrollTo(0,0); navPush(); },
  closeSeries(){ goBack(); },
  libGenre(v){ UI.libGenre = UI.libGenre === v && v ? '' : v; UI.libTag = ''; render(); },
  libTag(v){ UI.libTag = UI.libTag === v ? '' : v; render(); },
  seeTag(v){ UI.tab = 'lib'; UI.libGenre = ''; UI.libTag = v; const b = currentBook(); if(b) UI.seg = b.status; closeSheet(); },
  open(v){ openSheet({kind:'detail', id:v}); },
  openCand(v){ const c = candFrom(v); if(!c) return; const fromRec = v.startsWith('rec') || v.startsWith('aip'); openSheet({kind:'detail', cand:c, ref:v, srcType: fromRec ? 'ia' : 'recherche'}); },
  close(){ if(SHEET && SHEET.kind === 'import' && SHEET.phase === 'pick'){ S.pending = null; saveLocal(); } closeSheet(); },
  async addCurrent(){
    if(SHEET.busy) return; SHEET.busy = true; renderSheet();
    const ref = SHEET.ref; const b = await addOne(SHEET.cand, SHEET.srcType);
    if(ref && ref.startsWith('rec')) S.recs.splice(Number(ref.split(':')[1]), 1), save();
    if(b){ SHEET = {kind:'detail', id:b.id}; renderSheet(); render(); } else closeSheet();
  },
  async addCand(v, el){
    const c = candFrom(v); if(!c) return;
    el.disabled = true; el.innerHTML = '<div class="spinner"></div>';
    const type = (v.startsWith('rec') || v.startsWith('aip')) ? 'ia' : 'recherche';
    await addOne(c, type, v.startsWith('add') && SHEET ? SHEET.status : 'toread');
    if(v.startsWith('rec')){ S.recs.splice(Number(v.split(':')[1]), 1); save(); }
    if(SHEET && SHEET.kind === 'add') renderSheet();
    render();
  },
  dislike(v){ const r = S.recs[Number(v)]; if(r){ S.dislikes.push(r.title); S.recs.splice(Number(v),1); save(); render(); } },
  status(v){

    b.status = v;

  },
  rating(v){ const b = currentBook(); const n = Number(v); b.rating = b.rating === n ? 0 : n; touch(b); save(); renderSheet(); },
  spice(v){ const b = currentBook(); const n = Number(v); const cur = b.spice ?? b.spiceEst ?? 0; b.spice = (cur === n && b.spice != null) ? n - 1 : n; touch(b); save(); renderSheet(); },
  askDel(){ SHEET.confirmDel = true; renderSheet(); },
  cancelDel(){ SHEET.confirmDel = false; renderSheet(); },
  doDel(){ S.deleted = S.deleted || {}; S.deleted[SHEET.id] = Date.now(); S.books = S.books.filter(b => b.id !== SHEET.id); save(); closeSheet(); toast('Livre supprimé'); },
  openAdd(){ openSheet({kind:'add', q:'', results:null, status: UI.tab === 'lib' ? UI.seg : 'toread'}); },
  setStatus(v){ SHEET.status = v; if(SHEET.kind === 'import' && S.pending){ S.pending.status = v; saveLocal(); } renderSheet(); },
  openSettings(){ openSheet({kind:'settings', nokey: !S.settings.apiKey}); },
  pickShot(){ NEXT_STATUS = SHEET && SHEET.status || NEXT_STATUS; const f = $('#fileShot'); f.value = ''; f.click(); },
  sGenre(v){ if(v !== UI.sGenre) UI.sSpice = ''; UI.sGenre = v; if(UI.q) runSearch(); else if(v) loadGenre(); else render(); },
  refreshAI(){ loadAIPicks(true); },
  toggleRead(){ UI.hideRead = !UI.hideRead; render(); },
  clearQ(){ UI.q = ''; UI.sResults = null; if(UI.sGenre) loadGenre(); else render(); },
  recommend(v){ recommend(v || ''); },
  toggleImp(v){ const x = SHEET.items[Number(v)]; if(x && !x.owned){ x.checked = !x.checked; if(S.pending) save(); renderSheet(); } },
  discardImp(){ S.pending = null; save(); closeSheet(); },
  async confirmImp(){
    if(SHEET.busy) return; SHEET.busy = true; renderSheet();
    const picks = SHEET.items.filter(x => x.checked).map(x => x.cand);
    const st = SHEET.status || 'toread';

    S.pending = null; save();
    closeSheet(); UI.tab = 'lib'; UI.seg = st; UI.libGenre = ''; UI.libTag = ''; UI.libSeries = ''; render();
    if(added.length) toast(plural(added.length, 'livre') + ' ' + (added.length>1?'ajoutés':'ajouté') + ' à ta liste');
  },
  exportData(){
    try{
      const blob = new Blob([JSON.stringify({app:'ma-liste-lecture', version:1, date:new Date().toISOString(), books:S.books, settings:{goal:S.settings.goal}, dislikes:S.dislikes}, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ma-liste-lecture-' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      S.lastBackup = Date.now(); save(); render(); if(SHEET) renderSheet();
      toast('Sauvegarde créée');
    }catch(e){ toast('Export impossible : ' + e.message); }
  },
  async testAI(v, el){
    el.disabled = true; el.textContent = 'Test en cours…';
    const k = $('#key').value.trim(); if(k !== S.settings.apiKey){ S.settings.apiKey = k; S.settings.aiStatus = ''; save(); }
    try{ const t = await ai({system:'Réponds en JSON.', text:'Renvoie {"ok":true}'}); parseJSON(t); toast('La clé fonctionne, l\'IA est activée !'); }
    catch(e){ toast(e.message); }
    renderSheet();
  },
  async enrichOne(){
    const b = currentBook(); if(!b || SHEET.busy) return;
    SHEET.busy = true; renderSheet();
    try{
      const [e] = await enrichBooks([Object.assign({desc:'', categories:[]}, b, {desc:b.summary||''})]);
      Object.assign(b, {title:e.title, author:e.author, series:e.series, tome:e.tome, seriesTotal:e.seriesTotal, genre:e.genre, tags:e.tags, summary:e.summary, spiceEst:e.spiceEst, enriched:true}); touch(b);
      save(); toast('Fiche complétée');
    }catch(err){ toast(err.message); }
    if(SHEET) SHEET.busy = false; renderSheet(); render();
  },
  syncNow(){ syncNow(true); },
  forceUpdate(){ saveLocal(); location.replace(location.pathname + '?maj=' + Date.now()); },
  retryImport(){ if(LAST_INPUT) startImport(LAST_INPUT); },
  importData(){ const f = $('#fileBackup'); f.value = ''; f.click(); },
  async copyLink(){ try{ await navigator.clipboard.writeText(location.origin + location.pathname + '?import='); toast('Adresse copiée'); }catch(e){ toast('Copie impossible, sélectionne l\'adresse à la main.'); } }
};

/* ============ Flux ============ */
async function runSearch(){
  UI.sLoading = true; UI.sError = ''; UI.sResults = null; render();
  try{
    const hint = {'Fantasy':' subject:fantasy','Romance':' subject:romance','Romantasy':' romantasy','Policier & thriller':' subject:thriller','Historique':' subject:historical','Science-fiction':' subject:"science fiction"'}[UI.sGenre] || '';
    let res = await bookSearch(UI.q, 30);
    const seen = new Set();
    UI.sResults = res.filter(r => { const k = norm(r.title) + '|' + norm(r.author); if(seen.has(k)) return false; seen.add(k); return true; });
  }catch(e){ UI.sError = e.message; }
  UI.sLoading = false; render();
}
async function gbGenreList(g){
  const qs = OL_GENRE_Q[g] || [GB_GENRE[g] || g];
  let lists = await Promise.all(qs.map(q => olSearch({q, sort:'readinglog', limit:40}).catch(() => [])));
  if(lists.flat().filter(r => r.thumb).length < 10){
    const more = await Promise.all((GB_GENRE_Q[g] || []).slice(0,2).map(q => gbSearch(q, 40).catch(() => [])));
    lists = lists.concat(more);
  }
  const seen = new Set(); const out = [];
  lists.flat().forEach(r => {
    const k = norm(r.title) + '|' + norm((r.author||'').split(',')[0]);
    if(!r.thumb || !r.author || seen.has(k) || [...seen].some(x => x.split('|')[0] === norm(r.title))) return;
    seen.add(k); out.push(Object.assign(r, {genre:g}));
  });
  if(!out.length && lists.every(l => !l.length)) throw new Error('La recherche de livres ne répond pas pour le moment, réessaie.');
  // les plus lus d'abord (lecteurs Open Library, sinon avis × note), puis l'ordre de pertinence
  return out.map((r,i) => ({r, score:(r.reads||0) + (r.gCount||0) * (r.gRating||3), i})).sort((a,b) => b.score - a.score || a.i - b.i).map(x => x.r).slice(0, 40);
}
async function loadGenre(){
  const g = UI.sGenre; if(!g) return;
  loadAIPicks(false);
  if(UI.popCache[g]){ UI.pop = UI.popCache[g]; UI.popError = ''; UI.popLoading = false; render(); return; }
  UI.pop = null; UI.popError = ''; UI.popLoading = true; render();
  try{ const list = await gbGenreList(g); UI.popCache[g] = list; if(UI.sGenre === g) UI.pop = list; }
  catch(e){ if(UI.sGenre === g) UI.popError = e.message; }
  if(UI.sGenre === g){ UI.popLoading = false; render(); }
}
let AI_REQ = 0;
async function loadAIPicks(force){
  const g = UI.sGenre; if(!g) return;
  UI.aiError = '';
  if(!hasAI()){ UI.aiPicks = null; UI.aiLoading = false; render(); return; }
  const band = SPICY.has(g) ? UI.sSpice : '';
  const key = g + '|' + band;
  const c = S.curated[key];
  if(!force && c && Date.now() - c.at < 86400000){ UI.aiPicks = c.list.filter(r => !findOwned(r.title)); UI.aiLoading = false; render(); if(UI.aiPicks.length) return; }
  const req = ++AI_REQ;
  UI.aiPicks = null; UI.aiLoading = true; render();
  try{
    const prev = c ? c.list.map(x => x.title) : [];
    const lib = S.books.filter(b => b.rating > 0).map(b => b.title + ' (' + b.rating + '/5' + (b.spice != null ? ', spice ' + b.spice : '') + ')');
    const system = 'Tu es la libraire personnelle d\'une lectrice. Définitions des genres : ' + GENRE_DEF + ' Réponds uniquement en JSON : {"books":[{"title":"","author":"","series":null,"tome":null,"spice":null,"why":""}]}. "spice" = intensité des scènes de sexe de 0 à 5 pour Romance et Romantasy, sinon null. Pour une série, donne le tome 1. "why" : une phrase courte en français qui explique ce choix, en citant une de ses lectures si possible. Seulement des livres publiés, titre français s\'il existe.';
    const text = 'Propose 3 livres du genre « ' + g + ' » qu\'elle a de grandes chances d\'adorer.' +
      (band ? ' Niveau de spice : ' + SPICE_BANDS[band] + '.' : '') +
      (lib.length ? ' Ses livres notés : ' + lib.slice(0,80).join(' ; ') + '.' : ' Elle n\'a encore rien noté : choisis des valeurs sûres très appréciées.') +
      ' Ne propose aucun de ceux-ci : ' + S.books.map(b => b.title).concat(S.dislikes, force ? prev : []).slice(0,200).join(' ; ') + '.';
    const out = await ai({system, text});
    const list = (parseJSON(out).books || []).filter(b => b && b.title && !findOwned(b.title)).slice(0,3);
    const rich = await Promise.all(list.map(async b => Object.assign(await lookup(b.title, b.author), {series:b.series||'', tome:Number(b.tome)||null, genre:g, why:b.why||'', spiceEst: typeof b.spice==='number' ? b.spice : null})));
    S.curated[key] = {at:Date.now(), list:rich}; save();
    if(req === AI_REQ) UI.aiPicks = rich;
  }catch(e){ if(req === AI_REQ) UI.aiError = e.blocked ? 'Gemini gratuit n\'est pas disponible depuis ton pays.' : e.message; }
  if(req === AI_REQ){ UI.aiLoading = false; if(UI.tab === 'search') render(); }
}
async function recommendNoAI(){
  const pool = S.books.filter(b => b.rating >= 4).sort((a,b) => b.rating - a.rating);
  const base = (pool.length ? pool : S.books).slice(0,5);
  if(!base.length) throw new Error('Ajoute et note quelques livres pour avoir des suggestions.');
  const seen = new Set(S.books.map(b => norm(b.title)).concat(S.dislikes.map(norm)));
  const out = [];
  const ok = r => { const k = norm(r.title); if(!r.thumb || seen.has(k) || S.books.some(b => similar(b.title, r.title))) return false; seen.add(k); return true; };
  for(const b of base){
    const au = (b.author || '').split(',')[0].trim(); if(!au) continue;
    let res = []; try{ res = await olSearch({author:au, sort:'readinglog', limit:15}); }catch(e){}
    const pick = res.find(ok);
    if(pick) out.push(Object.assign(pick, {genre:b.genre, why:'Du même auteur que ' + b.title + (b.rating ? ', que tu as noté ' + b.rating + '/5' : '') + '.', spiceEst:null}));
    if(out.length >= 3) break;
  }
  const count = {}; base.forEach(b => count[b.genre] = (count[b.genre]||0) + 1);
  const g = Object.keys(count).sort((a,b) => count[b] - count[a])[0];
  if(g){ let res = []; try{ res = await gbGenreList(g); }catch(e){}
    res.filter(ok).slice(0, 5 - out.length).forEach(r => out.push(Object.assign(r, {genre:g, why:'Populaire en ' + g + ', ton genre préféré.', spiceEst:null}))); }
  if(!out.length) throw new Error('Pas de suggestion trouvée pour l\'instant.');
  return out;
}
async function recommend(ask){
  if(UI.recLoading) return;
  UI.recLoading = true; UI.recError = ''; UI.tab = 'me'; render();
  if(!hasAI()){
    try{ S.recs = (await recommendNoAI()).map(r => Object.assign(r, {ask:''})); save(); }catch(e){ UI.recError = e.message; }
    UI.recLoading = false; render(); return;
  }
  try{
    const lib = S.books.map(b => ({titre:b.title, auteur:b.author, genre:b.genre, statut: b.status==='read'?'lu':b.status==='reading'?'en cours':'à lire', note: b.rating || null, spice: b.spice ?? null}));
    const system = 'Tu es la libraire personnelle d\'une lectrice. Tu connais sa bibliothèque : les notes vont de 1 (déteste) à 5 (adore) ; le spice de 0 à 5 est la note qu\'elle a donnée à l\'intensité des scènes de sexe. Déduis ses goûts surtout des livres notés. Genres possibles : ' + GENRES.join(', ') + '. Définitions : ' + GENRE_DEF + ' Propose 5 livres qu\'elle n\'a pas déjà, publiés (pas d\'inventions), disponibles en français ou en anglais, titre français s\'il existe. Pour une série, propose le tome 1 sauf si elle a lu les précédents. "why" : une phrase en français, chaleureuse et précise, qui cite au moins une de ses lectures quand c\'est possible. Réponds uniquement en JSON : {"recs":[{"title":"","author":"","genre":"","why":"","spice":null}]} ("spice" de 0 à 5 pour Romance et Romantasy, sinon null).';
    const text = 'Sa bibliothèque : ' + JSON.stringify(lib.slice(0,300)) + '\nLivres qu\'elle a refusés (ne pas reproposer) : ' + JSON.stringify(S.dislikes.slice(-80)) + '\nSa demande : ' + (ask || 'ma prochaine lecture idéale, en variant un peu les genres que j\'aime');
    const out = await ai({system, text});
    const recs = (parseJSON(out).recs || []).filter(r => r && r.title && !findOwned(r.title)).slice(0,5);
    S.recs = await Promise.all(recs.map(async r => Object.assign(await lookup(r.title, r.author), {genre: GENRES.includes(r.genre) ? r.genre : '', why:r.why||'', spiceEst: typeof r.spice==='number' ? r.spice : null, ask: ask||''})));
    save();
  }catch(e){ UI.recError = e.message; if(e.blocked){ UI.recLoading = false; return recommend(ask); } }
  UI.recLoading = false; render();
  const f = $('#ask'); if(f) f.value = '';
}
async function addSearch(q){
  SHEET.q = q; if(!q) return;
  SHEET.loading = true; SHEET.error = ''; renderSheet();
  try{ SHEET.results = await bookSearch(q, 15); }catch(e){ SHEET.error = e.message; }
  SHEET.loading = false; if(SHEET && SHEET.kind==='add') renderSheet();
}
async function manualAdd(title, author){
  if(!title) return;
  SHEET.busy = true; renderSheet();
  const c = await lookup(title, author);
  const b = await addOne(c, 'manuel', SHEET.status);
  if(b){ SHEET = {kind:'detail', id:b.id}; renderSheet(); render(); } else closeSheet();
}
async function extractNoAI(text){
  const noise = /[@#]|https?:|www\.|\b(likes?|j'aime|abonn|suivre|follow|comment|r[ée]pon|reply|reels?|audio|vues|views|partag|envoyer|send|sponsoris|traduction|voir la)/i;
  const lines = [...new Set(String(text||'').split(/\n+/).map(x => x.replace(/[•|]+/g,' ').trim()))]
    .filter(x => x.length >= 3 && x.length <= 80 && !noise.test(x) && /[a-zà-ÿ]{3}/i.test(x)).slice(0, 14);
  const found = [];
  for(let i = 0; i < lines.length; i += 4){
    const part = await Promise.all(lines.slice(i, i+4).map(async l => {
      let res = []; try{ res = await olSearch({q:l, limit:5}); }catch(e){}
      if(!res.some(r => similar(r.title, l))){ try{ res = res.concat(await gbSearch(l, 4)); }catch(e){} }
      return res.filter(r => similar(r.title, l) && r.title.length >= 3).sort((a,b) => (b.thumb?1:0) - (a.thumb?1:0) || (b.reads||0) - (a.reads||0))[0] || null;
    }));
    found.push(...part);
  }
  const seen = new Set();
  return found.filter(r => r && !seen.has(norm(r.title)) && seen.add(norm(r.title)));
}
async function startImport(input){
  LAST_INPUT = input;
  const keepStatus = (S.pending && Date.now() - S.pending.at < 20*60000 && S.pending.status) || (input.image ? NEXT_STATUS : 'toread');
  NEXT_STATUS = 'toread';
  if(!SHEET) navPush();
  SHEET = {kind:'import', status:keepStatus, phase:'loading', msg: hasAI() ? 'L\'IA lit ta capture…' : 'Lecture de la capture…', items:[], source:{type:input.image ? 'capture' : 'instagram', url:input.url||'', date:Date.now()}};
  renderSheet();
  try{
    if(!input.text && !input.image) throw new Error('La capture n\'a pas pu être lue. Choisis-la dans Photos ci-dessous.');
    let cands;
    if(!hasAI() && !input.image){
      SHEET.msg = 'Recherche des livres sur la capture…'; renderSheet();
      cands = await extractNoAI(input.text);
    } else {
      let found;
      try{ found = await extractBooks(input); }
      catch(e){
        if(e.blocked && input.text){ return startImport(input); }
        if(e.busy && input.text){
          SHEET.msg = 'L\'IA est surchargée, recherche sans IA…'; renderSheet();
          cands = await extractNoAI(input.text);
          if(cands.length){ SHEET.note = 'L\'IA était surchargée : livres trouvés sans IA. Tu pourras compléter le résumé et le spice plus tard depuis la fiche du livre.'; }
          else throw e;
        } else throw e;
      }
      if(!cands){
      if(!found.length) throw new Error('Aucun livre trouvé sur cette capture. Si le titre n\'apparaît que sur la couverture, choisis la capture dans Photos : l\'IA lira l\'image.');
      SHEET.msg = 'Recherche des couvertures…'; renderSheet();
      cands = await Promise.all(found.map(f => lookup(f.title, f.author)));
      }
    }
    if(!cands.length) throw new Error('Aucun livre reconnu sur cette capture. Tu peux l\'ajouter à la main.');
    let items = cands.map(c => { const o = findOwned(c.title); return {cand:c, owned:!!o, checked:!o}; });
    const pend = S.pending && Date.now() - S.pending.at < 20*60000 ? S.pending.items : [];
    const before = pend.length;
    pend.forEach(p => { if(!items.some(x => norm(x.cand.title) === norm(p.cand.title))) items.unshift(Object.assign(p, {owned:!!findOwned(p.cand.title)})); });
    if(before) SHEET.note = (SHEET.note ? SHEET.note + ' ' : '') + 'Les livres de ta capture précédente sont gardés : tu peux enchaîner plusieurs captures avant de valider.';
    SHEET.items = items;
    S.pending = {at:Date.now(), items, source:SHEET.source, status:SHEET.status}; save();
    SHEET.phase = 'pick';
  }catch(e){
    SHEET.phase = 'error'; SHEET.error = e.message; SHEET.nokey = !!e.nokey;
    if(e.nokey){ SHEET = {kind:'settings', nokey:true, resume:input}; }
  }
  renderSheet();
}
function handleLaunch(){
  const p = new URLSearchParams(location.search);
  if(p.has('maj')){ history.replaceState(null, '', location.pathname); setTimeout(() => toast('App à jour · ' + APP_VERSION), 400); }
  const text = p.get('import'), url = p.get('url');
  if(text != null || url){
    history.replaceState(null, '', location.pathname);
    startImport({text:(text||'').trim(), url:url||''});
  }
}

render();
handleLaunch();
if(S.settings.ghToken) setTimeout(() => syncNow(false), 800);
